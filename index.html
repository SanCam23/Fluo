<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    
    <!-- iOS WebKit Standalone Configuration -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fluo" />
    <link rel="apple-touch-icon" href="/icon-180.jpg" />
    
    <!-- PWA & Theme Colors -->
    <meta name="theme-color" content="#0B0F19" />
    <meta name="description" content="Fluo - Gestión inteligente de finanzas personales e inversiones" />
    
    <!-- Security & Hardening: Content Security Policy (CSP) -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' https:;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com data:;
        img-src 'self' data: blob: https:;
        connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.binance.com https://query1.finance.yahoo.com https://query2.finance.yahoo.com https://autocomplete.clearbit.com https://api.coingecko.com https://*.coingecko.com;
        frame-ancestors 'none';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
      "
    />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>Fluo</title>
  </head>
  <body class="bg-[#0B0F19] text-white overflow-x-hidden antialiased select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
